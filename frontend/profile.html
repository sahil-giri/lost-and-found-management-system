<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | Lost &amp; Found</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile" data-nav="profile" data-auth="required">
<div class="container" style="max-width:600px"><h1>My profile</h1><div class="card"><div id="msg" class="alert" hidden></div>
<form id="profile-form" novalidate>
<div class="form-group"><label for="name">Name</label><input id="name" required></div>
<div class="form-group"><label for="email">Email</label><input id="email" disabled></div>
<div class="form-group"><label for="phone">Phone</label><input id="phone" type="tel"></div>
<hr style="border:0;border-top:1px solid var(--border);margin:1.2rem 0"><h2>Change password (optional)</h2>
<div class="form-group"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password"></div>
<div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password"></div>
<button class="btn" id="submit">Save changes</button></form></div></div>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
